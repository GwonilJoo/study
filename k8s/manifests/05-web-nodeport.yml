# 대응하는 명령어:
#   kubectl expose deployment web --name=web-np --port=80 --type=NodePort
#
# NodePort 는 ClusterIP 를 "대체"하는 게 아니라 그 위에 노드 포트를 얹는 것이다.
# 이 서비스에도 CLUSTER-IP 가 배정된다.
#
# 확인:
#   kubectl get svc web-np
#   # PORT(S) 칸이 80:31776/TCP 처럼 나온다  (서비스포트:노드포트)
#
#   # 파드가 하나도 없는 노드로 들어가도 다른 노드의 파드로 넘어간다
#   docker exec study-control-plane sh -c \
#     'for i in $(seq 1 30); do curl -s localhost:<노드포트>; done' | sort | uniq -c
#
# kind 주의:
#   노드가 도커 컨테이너라 노트북에서 localhost:<노드포트> 로는 접속되지 않는다.
#   kind-config.yml 에 extraPortMappings 를 넣고 클러스터를 재생성해야 한다.
apiVersion: v1
kind: Service
metadata:
  name: web-np
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80 # 서비스 포트 (클러스터 안에서)
      targetPort: 80 # 파드의 포트
      nodePort: 30080 # 노드에 열 포트. 범위 30000-32767
      # 생략하면 자동 배정된다. kind 의 extraPortMappings 와
      # 번호를 맞추려면 이렇게 고정해야 한다.
      protocol: TCP

  # 기본값은 Cluster. 주석을 풀면 그 노드의 파드에게만 보낸다.
  #   - 클라이언트 IP 보존, 홉 1번
  #   - 대신 노드별 파드 수에 따라 분배가 치우친다
  #   - 파드가 없는 노드로 들어온 트래픽은 버려진다
  # externalTrafficPolicy: Local
